
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLO Local Annotator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #202124;
  color: #eee;
}

header {
  padding: 12px 16px;
  background: #292a2d;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

button, input, select {
  font: inherit;
}

button {
  padding: 7px 11px;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .5;
}

label {
  display: flex;
  gap: 6px;
  align-items: center;
}

#workspace {
  display: flex;
  justify-content: center;
  align-items: center;
  height: calc(100vh - 110px);
  min-height: 250px;
  overflow: auto;
  padding: 10px;
}

#canvas {
  display: block;
  background: #111;
  cursor: crosshair;
  max-width: 95%;
  max-height: 100%;
  object-fit: contain;
  touch-action: none;
}

#status {
  padding: 8px 16px;
  background: #292a2d;
  font-size: 14px;
}

#className {
  width: 120px;
}

#classId {
  width: 65px;
}
</style>
</head>

<body>

<header>
  <input id="files" type="file" accept="image/*" multiple>

  <label>
    Classe:
    <input id="className" value="capacete">
  </label>

  <label>
    ID:
    <input id="classId" type="number" min="0" step="1" value="0">
  </label>

  <button id="prev">← Anterior</button>
  <button id="next">Próxima →</button>
  <button id="undo">Desfazer</button>
  <button id="clear">Limpar</button>
  <button id="save">Baixar YOLO .txt</button>
  <button id="saveAll">Baixar todas as anotações</button>
</header>

<div id="workspace">
  <canvas id="canvas"></canvas>
</div>

<div id="status">Carregue imagens para começar.</div>

<script>
'use strict';

const filesEl = document.getElementById('files');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const className = document.getElementById('className');
const classId = document.getElementById('classId');

const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const undoBtn = document.getElementById('undo');
const clearBtn = document.getElementById('clear');
const saveBtn = document.getElementById('save');
const saveAllBtn = document.getElementById('saveAll');

let files = [];
let index = 0;
let image = null;
let boxes = [];
let start = null;
let drawing = false;
let activePointerId = null;
let imageToken = 0;

// Cada imagem possui sua própria lista de caixas.
const annotations = new Map();

function msg(text) {
  statusEl.textContent = text;
}

function key() {
  return files[index]?.name || '';
}

function saveCurrentAnnotations() {
  if (files.length) {
    annotations.set(key(), boxes);
  }
}

function updateButtons() {
  prevBtn.disabled = index <= 0;
  nextBtn.disabled = !files.length || index >= files.length - 1;

  const hasImage = files.length > 0 && !!image;
  undoBtn.disabled = !hasImage || boxes.length === 0;
  clearBtn.disabled = !hasImage || boxes.length === 0;
  saveBtn.disabled = !hasImage;
  saveAllBtn.disabled = files.length === 0;
}

filesEl.addEventListener('change', () => {
  files = Array.from(filesEl.files)
    .filter(file => file.type.startsWith('image/'));

  index = 0;
  image = null;
  boxes = [];
  start = null;
  drawing = false;
  annotations.clear();

  if (!files.length) {
    canvas.width = 1;
    canvas.height = 1;
    msg('Nenhuma imagem válida selecionada.');
    updateButtons();
    return;
  }

  load();
});

function load() {
  if (!files.length) return;

  const token = ++imageToken;
  const file = files[index];
  const url = URL.createObjectURL(file);
  const nextImage = new Image();

  image = null;
  drawing = false;
  start = null;

  msg(`Carregando ${file.name}...`);
  updateButtons();

  nextImage.onload = () => {
    URL.revokeObjectURL(url);

    // Ignora carregamentos antigos ao navegar rapidamente.
    if (token !== imageToken) return;

    image = nextImage;
    boxes = annotations.get(key()) || [];

    fit();
    draw();

    msg(
      `${index + 1}/${files.length} — ${file.name} — ` +
      `${boxes.length} caixa(s)`
    );

    updateButtons();
  };

  nextImage.onerror = () => {
    URL.revokeObjectURL(url);

    if (token !== imageToken) return;

    image = null;
    msg(`Erro ao carregar: ${file.name}`);
    updateButtons();
  };

  nextImage.src = url;
}

// Dimensiona o canvas mantendo a proporção original da imagem.
function fit() {
  if (!image) return;

  const workspace = document.getElementById('workspace');
  const availableWidth = Math.max(1, workspace.clientWidth - 20);
  const availableHeight = Math.max(1, workspace.clientHeight - 20);

  const scale = Math.min(
    availableWidth / image.naturalWidth,
    availableHeight / image.naturalHeight,
    1
  );

  canvas.width = Math.max(
    1, Math.round(image.naturalWidth * scale)
  );

  canvas.height = Math.max(
    1, Math.round(image.naturalHeight * scale)
  );
}

// Converte o centro YOLO para o canto superior esquerdo
// somente para a renderização da caixa.
function draw() {
  if (!image) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

  boxes.forEach(box => {
    const w = box.w * canvas.width;
    const h = box.h * canvas.height;
    const x = (box.x - box.w / 2) * canvas.width;
    const y = (box.y - box.h / 2) * canvas.height;

    ctx.strokeStyle = '#00ff66';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);

    // O nome pertence à anotação, não ao campo atual.
    const label = `${box.id}: ${box.name ?? 'classe'}`;

    ctx.font = '14px Arial';

    const textWidth = ctx.measureText(label).width;
    const labelY = Math.max(14, y - 4);

    ctx.fillStyle = '#00ff66';
    ctx.fillRect(
      x,
      Math.max(0, labelY - 15),
      textWidth + 8,
      18
    );

    ctx.fillStyle = '#111';
    ctx.fillText(label, x + 4, labelY - 2);
  });
}

// Retorna coordenadas normalizadas entre 0 e 1.
function pos(event) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: Math.max(0, Math.min(
      1, (event.clientX - rect.left) / rect.width
    )),
    y: Math.max(0, Math.min(
      1, (event.clientY - rect.top) / rect.height
    ))
  };
}

canvas.addEventListener('pointerdown', event => {
  if (!image || drawing || event.button !== 0) return;

  event.preventDefault();

  start = pos(event);
  drawing = true;
  activePointerId = event.pointerId;

  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener('pointermove', event => {
  if (!drawing || event.pointerId !== activePointerId) return;

  draw();

  const p = pos(event);

  const x = Math.min(start.x, p.x);
  const y = Math.min(start.y, p.y);
  const w = Math.abs(p.x - start.x);
  const h = Math.abs(p.y - start.y);

  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 2;
  ctx.strokeRect(
    x * canvas.width,
    y * canvas.height,
    w * canvas.width,
    h * canvas.height
  );
});

function finishDrawing(event) {
  if (!drawing || event.pointerId !== activePointerId) return;

  const p = pos(event);

  drawing = false;
  activePointerId = null;

  const x = Math.min(start.x, p.x);
  const y = Math.min(start.y, p.y);
  const w = Math.abs(p.x - start.x);
  const h = Math.abs(p.y - start.y);

  start = null;

  if (w > 0.005 && h > 0.005) {
    const parsedId = Number(classId.value);
    const id = Number.isInteger(parsedId) && parsedId >= 0
      ? parsedId
      : 0;

    boxes.push({
      id,
      name: className.value.trim() || 'classe',
      x: x + w / 2,
      y: y + h / 2,
      w,
      h
    });

    saveCurrentAnnotations();
  }

  draw();

  msg(
    `${index + 1}/${files.length} — ${key()} — ` +
    `${boxes.length} caixa(s)`
  );

  updateButtons();
}

canvas.addEventListener('pointerup', finishDrawing);

canvas.addEventListener('pointercancel', event => {
  if (event.pointerId !== activePointerId) return;

  drawing = false;
  activePointerId = null;
  start = null;
  draw();
});

undoBtn.addEventListener('click', () => {
  boxes.pop();
  saveCurrentAnnotations();
  draw();
  updateButtons();
});

clearBtn.addEventListener('click', () => {
  boxes = [];
  saveCurrentAnnotations();
  draw();
  updateButtons();
});

prevBtn.addEventListener('click', () => {
  if (index <= 0) return;

  saveCurrentAnnotations();
  index--;
  load();
});

nextBtn.addEventListener('click', () => {
  if (index >= files.length - 1) return;

  saveCurrentAnnotations();
  index++;
  load();
});

window.addEventListener('resize', () => {
  if (!image) return;
  fit();
  draw();
});

function txtFor(boxes) {
  // O formato YOLO exige apenas:
  // class_id center_x center_y width height
  return boxes.map(box =>
    `${box.id} ${box.x.toFixed(6)} ` +
    `${box.y.toFixed(6)} ${box.w.toFixed(6)} ` +
    `${box.h.toFixed(6)}`
  ).join('\n') + (boxes.length ? '\n' : '');
}

function download(name, text) {
  const blob = new Blob([text], {
    type: 'text/plain;charset=utf-8'
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function baseName(filename) {
  return filename.replace(/\.[^.]+$/, '');
}

saveBtn.addEventListener('click', () => {
  if (!files.length || !image) return;

  saveCurrentAnnotations();

  download(
    baseName(key()) + '.txt',
    txtFor(boxes)
  );
});

saveAllBtn.addEventListener('click', () => {
  if (!files.length) return;

  saveCurrentAnnotations();

  // Alguns navegadores bloqueiam downloads múltiplos.
  // Pode ser necessário autorizar os downloads no navegador.
  files.forEach(file => {
    const imageBoxes = annotations.get(file.name) || [];

    download(
      baseName(file.name) + '.txt',
      txtFor(imageBoxes)
    );
  });
});

updateButtons();
</script>

</body>
</html>
